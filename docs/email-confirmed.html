<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10264a">
<title>Bharat Saathi – ईमेल सत्यापन</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f6fb;color:#172b4d;font-family:Arial,"Noto Sans Devanagari",sans-serif}
main{width:min(100%,520px);padding:32px 26px;background:#fff;border:1px solid #e5eaf2;border-radius:22px;box-shadow:0 12px 36px rgba(16,38,74,.08);text-align:center}
.mark{width:64px;height:64px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:#e8f6ef;color:#14804a;font-size:34px}
h1{margin:0 0 12px;font-size:25px}p{line-height:1.7;color:#53627a;margin:10px 0}
a{display:inline-block;margin-top:16px;padding:13px 22px;border-radius:12px;background:#10264a;color:#fff;text-decoration:none;font-weight:700}
#error{display:none;color:#a32626}
</style>
</head>
<body>
<main>
<div class="mark" id="mark">✓</div>
<h1 id="title">ईमेल सत्यापन पूरा हुआ</h1>
<p id="message">आपका Bharat Saathi ईमेल सत्यापित हो गया है। अब इस पेज को बंद करके Bharat Saathi ऐप खोलें और अपने ईमेल व पासवर्ड से लॉगिन करें।</p>
<p id="error"></p>
<a href="https://annukumar6280-glitch.github.io/Bharat-Saathi-/">Bharat Saathi वेबसाइट खोलें</a>
</main>
<script>
const params=new URLSearchParams(location.hash.slice(1));
const code=params.get('error_code');
if(code){
document.getElementById('mark').textContent='!';
document.getElementById('title').textContent='ईमेल सत्यापन पूरा नहीं हुआ';
document.getElementById('message').textContent='लिंक की पुष्टि नहीं हो सकी।';
const e=document.getElementById('error');e.style.display='block';e.textContent=params.get('error_description')||code;
}
</script>
</body>
</html>
