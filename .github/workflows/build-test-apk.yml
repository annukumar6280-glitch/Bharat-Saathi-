name: Bharat Saathi Android Validation
on:
  push:
    branches:
      - feature/family-friends-live-location
      - feature/ai-poster-calculator-soundbox
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.bharatsaathi --project-name bharat_saathi .
      - name: Add Maven Central mirror fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          content = settings.read_text()
          mirror = 'maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }'
          if mirror not in content:
              if "mavenCentral()" not in content:
                  raise SystemExit("Gradle plugin repositories do not expose Maven Central")
              content = content.replace("mavenCentral()", mirror + "\n        mavenCentral()")
              settings.write_text(content)
          print("Configured Google-hosted Maven Central mirror before Maven Central")
          PY
      - name: Configure Android email confirmation deep link
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          scheme = 'android:scheme="bharatsaathi"'
          if scheme not in content:
              main_action = content.find('android:name="android.intent.action.MAIN"')
              if main_action < 0:
                  raise SystemExit("MainActivity launcher intent filter not found")
              activity_start = content.rfind("<activity", 0, main_action)
              activity_end = content.find("</activity>", main_action)
              if activity_start < 0 or activity_end < 0:
                  raise SystemExit("Could not locate MainActivity in Android manifest")
              intent_filter = '''
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="bharatsaathi" android:host="login-callback" />
                  </intent-filter>
              '''
              content = content[:activity_end] + intent_filter + content[activity_end:]
              manifest.write_text(content)
          verified = manifest.read_text()
          if scheme not in verified or 'android:host="login-callback"' not in verified:
              raise SystemExit("Bharat Saathi email deep link verification failed")
          print("Configured bharatsaathi://login-callback Android deep link")
          PY
      - name: Configure Android location permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />',
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
          ]
          start = content.find("<application")
          if start < 0:
              raise SystemExit("Android application tag missing")
          prefix = content[:start]
          suffix = content[start:]
          for permission in permissions:
              marker = permission.split('"')[1]
              if marker not in content:
                  prefix += permission + "\n"
          manifest.write_text(prefix + suffix)
          print("Configured fine, background and foreground-service location permissions")
          PY
      - name: Set Android target API 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          gradle = next((p for p in candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit("Android Gradle file missing")
          text = gradle.read_text()
          text, count = re.subn(r"targetSdk\s*=\s*flutter\.targetSdkVersion", "targetSdk = 36", text)
          if not count:
              text, count = re.subn(r"targetSdkVersion\s+flutter\.targetSdkVersion", "targetSdkVersion 36", text)
          if not count and not re.search(r"targetSdk(?:Version)?\s*(?:=\s*)?36\b", text):
              raise SystemExit("Could not set targetSdk 36")
          gradle.write_text(text)
          if not re.search(r"targetSdk(?:Version)?\s*(?:=\s*)?36\b", gradle.read_text()):
              raise SystemExit("Target API 36 verification failed")
          PY
      - name: Set compile SDK 37 for permission_handler
        run: |
          sdkmanager "platforms;android-37"
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          gradle = next((p for p in candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit("Android app Gradle file was not generated")

          content = gradle.read_text()
          patterns = [
              (r"compileSdk[ ]*=[ ]*flutter[.]compileSdkVersion", "compileSdk = 37"),
              (r"compileSdkVersion[ ]+flutter[.]compileSdkVersion", "compileSdkVersion 37"),
          ]
          updated = content
          for pattern, replacement in patterns:
              updated, count = re.subn(pattern, replacement, updated)
              if count:
                  break
          if updated == content and not re.search(r"compileSdk(?:Version)?[ ]*(?:=[ ]*)?37[ ]*", content):
              raise SystemExit("Could not safely set compileSdk to 37 in " + str(gradle))

          gradle.write_text(updated)
          verified = gradle.read_text()
          if not re.search(r"compileSdk(?:Version)?[ ]*(?:=[ ]*)?37[ ]*", verified):
              raise SystemExit("Compile SDK 37 verification failed")
          print(f"Verified compileSdk 37 in {gradle}")
          PY
      - name: Configure Google Mobile Ads test App ID
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          if "com.google.android.gms.ads.APPLICATION_ID" not in text:
              start = text.find("<application")
              end = text.find(">", start)
              if start < 0 or end < 0:
                  raise SystemExit("Android application tag missing")
              meta = '\n        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713" />'
              text = text[:end + 1] + meta + text[end + 1:]
              manifest.write_text(text)
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze
      - name: Run widget tests
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bharat-saathi-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
