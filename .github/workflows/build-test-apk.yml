name: Build Bharat Saathi APK

on:
  push:
    branches:
      - feature/khata-customer-ledger-apk
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.bharatsaathi --project-name bharat_saathi .
      - name: Set Android target API 36 and test Ads App ID
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          gradle = next((p for p in candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit("Android app Gradle file was not generated")
          content = gradle.read_text()
          patterns = [(r"targetSdk\s*=\s*flutter\.targetSdkVersion", "targetSdk = 36"),
                      (r"targetSdkVersion\s+flutter\.targetSdkVersion", "targetSdkVersion 36")]
          updated = content
          for pattern, replacement in patterns:
              updated, count = re.subn(pattern, replacement, updated)
              if count:
                  break
          if updated == content and not re.search(r"targetSdk(?:Version)?\s*(?:=\s*)?36\b", content):
              raise SystemExit("Could not safely set targetSdk to 36")
          gradle.write_text(updated)
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          xml = manifest.read_text()
          if "com.google.android.gms.ads.APPLICATION_ID" not in xml:
              pos = xml.find(">", xml.find("<application"))
              xml = xml[:pos+1] + '\n        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713" />' + xml[pos+1:]
              manifest.write_text(xml)
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Build release APK
        run: cd android && ./gradlew assembleRelease -x lintVitalAnalyzeRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bharat-saathi-test-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
