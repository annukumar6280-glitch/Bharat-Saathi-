name: Publish Bharat Saathi policy pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "bharat-saathi-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare public policy pages only
        run: |
          mkdir -p _site
          cp docs/privacy-policy.html _site/privacy-policy.html
          cp docs/delete-account.html _site/delete-account.html
      - name: Upload policy website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy policy website
        id: deployment
        uses: actions/deploy-pages@v4
