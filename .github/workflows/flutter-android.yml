name: Flutter Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: bharat-saathi-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.bharatsaathi --project-name bharat_saathi .
      - name: Disable Android device backups for local financial records
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          match = re.search(r"<application\\b[^>]*>", content, re.S)
          if not match:
              raise SystemExit("Android application tag not found")

          tag = match.group(0)
          attributes = {
              "android:allowBackup": "false",
              "android:fullBackupContent": "@xml/backup_rules",
              "android:dataExtractionRules": "@xml/data_extraction_rules",
          }
          for name, value in attributes.items():
              pattern = rf'\\b{re.escape(name)}="[^"]*"'
              replacement = f'{name}="{value}"'
              if re.search(pattern, tag):
                  tag = re.sub(pattern, replacement, tag)
              else:
                  tag = tag[:-1] + f' {replacement}>'
          content = content[:match.start()] + tag + content[match.end():]
          manifest.write_text(content)

          xml_dir = Path("android/app/src/main/res/xml")
          xml_dir.mkdir(parents=True, exist_ok=True)
          (xml_dir / "backup_rules.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <full-backup-content>
              <exclude domain="root" path="." />
              <exclude domain="database" path="." />
              <exclude domain="sharedpref" path="." />
              <exclude domain="file" path="." />
              <exclude domain="external" path="." />
          </full-backup-content>
          """)
          (xml_dir / "data_extraction_rules.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <data-extraction-rules>
              <cloud-backup>
                  <exclude domain="root" path="." />
                  <exclude domain="database" path="." />
                  <exclude domain="sharedpref" path="." />
                  <exclude domain="file" path="." />
                  <exclude domain="external" path="." />
              </cloud-backup>
              <device-transfer>
                  <exclude domain="root" path="." />
                  <exclude domain="database" path="." />
                  <exclude domain="sharedpref" path="." />
                  <exclude domain="file" path="." />
                  <exclude domain="external" path="." />
              </device-transfer>
          </data-extraction-rules>
          """)
          verified = manifest.read_text()
          for name, value in attributes.items():
              if f'{name}="{value}"' not in verified:
                  raise SystemExit(f"Failed to set {name}")
          print("Verified Android OS backup exclusions for app-local records")
          PY
      - name: Set and verify Android 16 target API
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          gradle = next((p for p in candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit("Android app Gradle file was not generated")

          content = gradle.read_text()
          patterns = [
              (r"targetSdk\s*=\s*flutter\.targetSdkVersion", "targetSdk = 36"),
              (r"targetSdkVersion\s+flutter\.targetSdkVersion", "targetSdkVersion 36"),
          ]
          updated = content
          for pattern, replacement in patterns:
              updated, count = re.subn(pattern, replacement, updated)
              if count:
                  break
          if updated == content and not re.search(r"targetSdk(?:Version)?\s*(?:=\s*)?36\b", content):
              raise SystemExit("Could not safely set targetSdk to 36 in " + str(gradle))

          gradle.write_text(updated)
          verified = gradle.read_text()
          if not re.search(r"targetSdk(?:Version)?\s*(?:=\s*)?36\b", verified):
              raise SystemExit("Target API 36 verification failed")
          print(f"Verified Android target API 36 in {gradle}")
          PY
      - name: Configure Google Mobile Ads test App ID
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          marker = "<application"
          start = content.find(marker)
          if start < 0:
              raise SystemExit("Android application tag not found")
          end = content.find(">", start)
          if "com.google.android.gms.ads.APPLICATION_ID" not in content:
              metadata = '\n        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713" />'
              content = content[:end + 1] + metadata + content[end + 1:]
              manifest.write_text(content)
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze
      - name: Run widget tests
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bharat-saathi-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
