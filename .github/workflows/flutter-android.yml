name: Flutter Android build

on:
  push:
    branches: [main, feature/family-friends-live-location, feature/ai-poster-calculator-soundbox, feature/ai-call-assistant-sim-otp, release/eight-core-features]
  pull_request:
    branches: [main]

concurrency:
  group: bharat-saathi-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.bharatsaathi --project-name bharat_saathi .
      - name: Configure Android email confirmation deep link
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          scheme = 'android:scheme="bharatsaathi"'
          if scheme not in content:
              main_action = content.find('android:name="android.intent.action.MAIN"')
              if main_action < 0:
                  raise SystemExit("MainActivity launcher intent filter not found")
              activity_start = content.rfind("<activity", 0, main_action)
              activity_end = content.find("</activity>", main_action)
              if activity_start < 0 or activity_end < 0:
                  raise SystemExit("Could not locate MainActivity in Android manifest")
              intent_filter = '''
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="bharatsaathi" android:host="login-callback" />
                  </intent-filter>
              '''
              content = content[:activity_end] + intent_filter + content[activity_end:]
              manifest.write_text(content)
          verified = manifest.read_text()
          if scheme not in verified or 'android:host="login-callback"' not in verified:
              raise SystemExit("Bharat Saathi email deep link verification failed")
          print("Configured bharatsaathi://login-callback Android deep link")
          PY
      - name: Configure Android location permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />',
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />',
          ]
          start = content.find("<application")
          if start < 0:
              raise SystemExit("Android application tag missing")
          prefix = content[:start]
          suffix = content[start:]
          for permission in permissions:
              marker = permission.split('"')[1]
              if marker not in content:
                  prefix += permission + "\n"
          manifest.write_text(prefix + suffix)
          print("Configured fine, background and foreground-service location permissions")
          PY
      - name: Configure AI Teacher voice permissions and Android speech services
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          start = content.find("<application")
          if start < 0:
              raise SystemExit("Android application tag missing")
          prefix, suffix = content[:start], content[start:]
          permission = '    <uses-permission android:name="android.permission.RECORD_AUDIO" />'
          if "android.permission.RECORD_AUDIO" not in content:
              prefix += permission + "\n"
          content = prefix + suffix
          if "<queries>" not in content:
              queries = """    <queries>
                  <intent><action android:name="android.speech.RecognitionService" /></intent>
                  <intent><action android:name="android.intent.action.TTS_SERVICE" /></intent>
              </queries>
          """
              start = content.find("<application")
              content = content[:start] + queries + content[start:]
          manifest.write_text(content)
          print("Configured microphone permission and speech/TTS service visibility")
          PY
      - name: Set and verify Android 16 target API
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          gradle = next((p for p in candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit("Android app Gradle file was not generated")

          content = gradle.read_text()
          patterns = [
              (r"targetSdk\s*=\s*flutter\.targetSdkVersion", "targetSdk = 36"),
              (r"targetSdkVersion\s+flutter\.targetSdkVersion", "targetSdkVersion 36"),
          ]
          updated = content
          for pattern, replacement in patterns:
              updated, count = re.subn(pattern, replacement, updated)
              if count:
                  break
          if updated == content and not re.search(r"targetSdk(?:Version)?\s*(?:=\s*)?36\b", content):
              raise SystemExit("Could not safely set targetSdk to 36 in " + str(gradle))

          gradle.write_text(updated)
          verified = gradle.read_text()
          if not re.search(r"targetSdk(?:Version)?\s*(?:=\s*)?36\b", verified):
              raise SystemExit("Target API 36 verification failed")
          print(f"Verified Android target API 36 in {gradle}")
          PY
      - name: Configure scheduled reminder notifications
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          app_start = content.find("<application")
          if app_start < 0:
              raise SystemExit("Android application tag missing")
          prefix, suffix = content[:app_start], content[app_start:]
          permission = '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />'
          if "android.permission.RECEIVE_BOOT_COMPLETED" not in content:
              prefix += permission + "\n"
          content = prefix + suffix
          receiver = """        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
                  <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="com.htc.intent.action.QUICKBOOT_POWERON" />
                      </intent-filter>
                  </receiver>
          """
          if "ScheduledNotificationReceiver" not in content:
              app_end = content.find(">", content.find("<application")) + 1
              content = content[:app_end] + "\n" + receiver + content[app_end:]
          manifest.write_text(content)
          gradle_candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          gradle = next((p for p in gradle_candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit("Android app Gradle file not found")
          g = gradle.read_text()
          if "build.gradle.kts" in str(gradle):
              if "isCoreLibraryDesugaringEnabled" not in g:
                  g = g.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true", 1)
              if "coreLibraryDesugaring(" not in g:
                  g = g.replace("dependencies {", 'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")', 1)
              if "multiDexEnabled = true" not in g:
                  g = g.replace("defaultConfig {", "defaultConfig {\n        multiDexEnabled = true", 1)
          else:
              if "coreLibraryDesugaringEnabled true" not in g:
                  g = g.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled true", 1)
              if "coreLibraryDesugaring '" not in g:
                  g = g.replace("dependencies {", "dependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'", 1)
              if "multiDexEnabled true" not in g:
                  g = g.replace("defaultConfig {", "defaultConfig {\n        multiDexEnabled true", 1)
          gradle.write_text(g)
          print("Configured scheduled notification receivers and Java API desugaring")
          PY
      - name: Configure Google Mobile Ads test App ID
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          marker = "<application"
          start = content.find(marker)
          if start < 0:
              raise SystemExit("Android application tag not found")
          end = content.find(">", start)
          if "com.google.android.gms.ads.APPLICATION_ID" not in content:
              metadata = '\n        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713" />'
              content = content[:end + 1] + metadata + content[end + 1:]
              manifest.write_text(content)
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze
      - name: Run widget tests
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bharat-saathi-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
